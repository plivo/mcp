name: Deploy

# A merge to main is a production deploy of the Worker behind mcp.plivo.com.
on:
  push:
    branches: [main]
  # Redeploys main without a merge, for example after a rollback.
  workflow_dispatch:

permissions:
  contents: read

# A newer merge waits for the running deploy; cancelling one midway could leave main and the Worker out of step.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can be pointed at any branch; only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare token lives in this environment, which only main can use.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The token is given to this step alone, so the install and test steps above never see it.
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?set the production environment secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?set the repo variable CF_ACCOUNT_ID}"
          npx wrangler deploy
